spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/modular_store_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false

  web:
    error:
      include-message: always
      include-binding-errors: always
